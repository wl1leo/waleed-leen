name: Deploy to VPS

on:
  push:
    branches: [master, claude/eager-mayer-9bnglj]
  workflow_dispatch:

env:
  VPS_HOST: 169.58.51.228
  SITE_DIR: /var/www/waleed-leen

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check password secret
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "::error::Add the VPS root password as repository secret VPS_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          sudo apt-get install -y sshpass >/dev/null

      - name: Install nginx on the VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@$VPS_HOST 'bash -s' <<'REMOTE'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          command -v nginx >/dev/null || { apt-get update -q && apt-get install -y -q nginx; }
          command -v rsync >/dev/null || apt-get install -y -q rsync
          mkdir -p /var/www/waleed-leen
          cat > /etc/nginx/sites-available/waleed-leen <<'CONF'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;
              root /var/www/waleed-leen;
              index home.html;
              location / { try_files $uri $uri/ =404; }
              location ~ /\. { deny all; }
          }
          CONF
          ln -sf /etc/nginx/sites-available/waleed-leen /etc/nginx/sites-enabled/waleed-leen
          rm -f /etc/nginx/sites-enabled/default
          if command -v ufw >/dev/null && ufw status | grep -q active; then ufw allow 80/tcp; ufw allow 443/tcp; fi
          nginx -t
          systemctl enable --now nginx
          systemctl reload nginx
          REMOTE

      - name: Upload site files
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          rsync -az --delete --exclude '.git' --exclude '.github' \
            -e "sshpass -e ssh -o StrictHostKeyChecking=no" \
            ./ root@$VPS_HOST:$SITE_DIR/

      - name: Check the site responds
        run: |
          sleep 2
          curl -sSf -o /dev/null -w "HTTP %{http_code}\n" http://$VPS_HOST/
